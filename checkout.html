<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout - JugaadMart</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .checkout-container {
            max-width: 1100px;
            margin: 40px auto;
            padding: 0 20px;
            display: grid;
            grid-template-columns: 1.5fr 1fr;
            gap: 40px;
        }
        .checkout-form h2 { font-size: 22px; margin-bottom: 20px; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; font-weight: 600; margin-bottom: 6px; }
        .form-group input, .form-group textarea, .form-group select {
            width: 100%; padding: 10px; border: 1px solid #ccc;
            border-radius: 6px; font-size: 15px; box-sizing: border-box;
        }
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .payment-option { margin: 10px 0; }
        .order-summary { background: #f9f9f9; padding: 20px; border-radius: 8px; height: fit-content; }
        .summary-row { display: flex; justify-content: space-between; margin: 10px 0; }
        .summary-total { font-weight: 700; font-size: 18px; border-top: 2px solid #ddd; padding-top: 10px; }
        .place-order-btn {
            width: 100%; background: #16a34a; color: white; border: none;
            padding: 14px; border-radius: 6px; font-size: 17px; font-weight: 700;
            cursor: pointer; margin-top: 15px;
        }
        @media (max-width: 768px) { 
            .checkout-container { grid-template-columns: 1fr; }
            .form-row { grid-template-columns: 1fr; }
        }
    </style>
    <script src="script.js" defer></script>
</head>
<body>
    <nav class="navbar">
        <div class="logo">Jugaad<span>Mart</span></div>
    </nav>

    <div class="checkout-container">
        <div class="checkout-form">
            <h2>1. Delivery Address</h2>
            <form id="checkoutForm">
                <div class="form-row">
                    <div class="form-group">
                        <label>Full Name *</label>
                        <input type="text" id="fullName" required>
                    </div>
                    <div class="form-group">
                        <label>Mobile *</label>
                        <input type="tel" id="mobile" required pattern="[0-9]{10}">
                    </div>
                </div>
                <div class="form-group">
                    <label>Full Address *</label>
                    <textarea id="address" rows="3" required></textarea>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>City *</label>
                        <input type="text" id="city" required>
                    </div>
                    <div class="form-group">
                        <label>Pincode *</label>
                        <input type="text" id="pincode" required pattern="[0-9]{6}">
                    </div>
                </div>

                <h2 style="margin-top: 30px;">2. Payment Method</h2>
                <div class="payment-option">
                    <input type="radio" id="cod" name="payment" value="COD" checked>
                    <label for="cod">Cash on Delivery</label>
                </div>
                <div class="payment-option">
                    <input type="radio" id="upi" name="payment" value="UPI">
                    <label for="upi">UPI / GPay / PhonePe</label>
                </div>
            </form>
        </div>

        <div class="order-summary">
            <h2>Order Summary</h2>
            <div id="checkout-items"></div>
            <div class="summary-row">
                <span>Subtotal</span><span id="checkout-subtotal">$0</span>
            </div>
            <div class="summary-row">
                <span>Delivery</span><span id="checkout-delivery">$0</span>
            </div>
            <div class="summary-row">
                <span>Tax</span><span id="checkout-tax">$0</span>
            </div>
            <div class="summary-row summary-total">
                <span>Total</span><span id="checkout-total">$0</span>
            </div>
            <button class="place-order-btn" onclick="placeOrder()">Place Order / Buy Now</button>
        </div>
    </div>
</body>
</html>
