<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout - JugaadMart</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .checkout-container {
            max-width: 1100px;
            margin: 100px auto 40px;
            padding: 0 20px;
            display: grid;
            grid-template-columns: 1.5fr 1fr;
            gap: 40px;
        }
        .checkout-form h2 { 
            font-size: 22px; 
            margin-bottom: 20px; 
            color: #1f2937;
        }
        .form-group { margin-bottom: 15px; }
        .form-group label { 
            display: block; 
            font-weight: 600; 
            margin-bottom: 6px;
            color: #374151;
        }
        .form-group input, .form-group textarea, .form-group select {
            width: 100%; 
            padding: 10px; 
            border: 1px solid #d1d5db;
            border-radius: 6px; 
            font-size: 15px; 
            box-sizing: border-box;
        }
        .form-group input:focus, .form-group textarea:focus {
            outline: none;
            border-color: #3B82F6;
        }
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .payment-option { 
            margin: 10px 0;
            padding: 12px;
            border: 1px solid #e5e7eb;
            border-radius: 6px;
        }
        .payment-option input { margin-right: 8px; }
        .order-summary { 
            background: #f9fafb; 
            padding: 20px; 
            border-radius: 8px; 
            height: fit-content;
            border: 1px solid #e5e7eb;
            position: sticky;
            top: 100px;
        }
        .summary-row { 
            display: flex; 
            justify-content: space-between; 
            margin: 10px 0;
            color: #6b7280;
        }
        .summary-total { 
            font-weight: 700; 
            font-size: 18px; 
            border-top: 2px solid #ddd; 
            padding-top: 10px;
            color: #1f2937;
        }
        .place-order-btn {
            width: 100%; 
            background: #16a34a; 
            color: white; 
            border: none;
            padding: 14px; 
            border-radius: 6px; 
            font-size: 17px; 
            font-weight: 700;
            cursor: pointer; 
            margin-top: 15px;
        }
        .place-order-btn:hover {
            background: #15803d;
        }
        .location-btn {
            width: 100%; 
            padding: 12px; 
            background: #10B981; 
            color: white; 
            border: none; 
            border-radius: 6px; 
            cursor: pointer; 
            font-weight: 600;
            font-size: 15px;
        }
        .location-btn:hover {
            background: #059669;
        }
        #location-status {
            font-size: 12px; 
            color: #6b7280; 
            margin-top: 8px;
        }
        @media (max-width: 768px) { 
            .checkout-container { grid-template-columns: 1fr; }
            .form-row { grid-template-columns: 1fr; }
            .order-summary { position: static; }
        }
    </style>
    <script src="script.js" defer></script>
</head>
<body>
    <nav class="navbar">
        <div class="logo">Jugaad<span>Mart</span></div>
        <ul class="nav-links" id="navLinks">
            <li><a href="index.html">Home</a></li>
            <li><a href="cart.html">Cart</a></li>
        </ul>
        <div class="hamburger" onclick="toggleMenu()">☰</div>
    </nav>

    <div class="checkout-container">
        <div class="checkout-form">
            <h2>1. Delivery Address</h2>
            <form id="checkoutForm">
                <div class="form-row">
                    <div class="form-group">
                        <label>Full Name *</label>
                        <input type="text" id="fullName" required>
                    </div>
                    <div class="form-group">
                        <label>Mobile *</label>
                        <input type="tel" id="mobile" required pattern="[0-9]{10}" placeholder="10 digit number">
                    </div>
                </div>
                
                <div class="form-group">
                    <button type="button" onclick="getLocation()" class="location-btn">
                        <i class="fas fa-map-marker-alt"></i> Use My Current Location
                    </button>
                    <p id="location-status"></p>
                </div>

                <div class="form-group">
                    <label>Street Address / House No. *</label>
                    <input type="text" id="street" required>
                </div>
                
                <div class="form-row">
                    <div class="form-group">
                        <label>City *</label>
                        <input type="text" id="city" required>
                    </div>
                    <div class="form-group">
                        <label>State *</label>
                        <input type="text" id="state" required>
                    </div>
                </div>
                
                <div class="form-group">
                    <label>Pincode *</label>
                    <input type="text" id="pincode" required pattern="[0-9]{6}" placeholder="6 digits">
                </div>

                <h2 style="margin-top: 30px;">2. Payment Method</h2>
                <div class="payment-option">
                    <input type="radio" id="cod" name="payment" value="COD" checked>
                    <label for="cod">Cash on Delivery</label>
                </div>
                <div class="payment-option">
                    <input type="radio" id="upi" name="payment" value="UPI">
                    <label for="upi">UPI / GPay / PhonePe</label>
                </div>
                <div class="payment-option">
                    <input type="radio" id="card" name="payment" value="Card">
                    <label for="card">Credit / Debit Card</label>
                </div>
            </form>
        </div>

        <div class="order-summary">
            <h2>Order Summary</h2>
            <div id="checkout-items"></div>
            <div class="summary-row">
                <span>Subtotal</span><span id="checkout-subtotal">₹0</span>
            </div>
            <div class="summary-row">
                <span>Delivery</span><span id="checkout-delivery">₹0</span>
            </div>
            <div class="summary-row">
                <span>Tax (18% GST)</span><span id="checkout-tax">₹0</span>
            </div>
            <div class="summary-row summary-total">
                <span>Total</span><span id="checkout-total">₹0</span>
            </div>
            <button class="place-order-btn" onclick="placeOrder()">
                <i class="fas fa-lock"></i> Place Order
            </button>
            <p style="text-align:center; font-size:12px; color:#6b7280; margin-top:10px;">
                By placing order, you agree to our Terms & Conditions
            </p>
        </div>
    </div>

    <script>
        function toggleMenu() {
            document.getElementById('navLinks').classList.toggle('show');
        }
    </script>
</body>
</html>
